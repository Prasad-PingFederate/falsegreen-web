name: Playwright E2E & Web Tests

on:
  push:
    branches: [ main, pre-dev, feat/*, fix/* ]
  pull_request:
    branches: [ main, pre-dev ]
  workflow_dispatch:
    inputs:
      test_path:
        description: 'Test file or path to run (e.g. tests/, tests/test_playwright_e2e.py)'
        required: false
        default: 'tests/'
        type: string
      pytest_args:
        description: 'Additional pytest options (e.g. -k test_name, -m marker)'
        required: false
        default: ''
        type: string

jobs:
  test:
    name: Playwright E2E & API Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Pytest & Playwright E2E Suite
        env:
          PYTHONPATH: .
        run: |
          TEST_PATH="${{ inputs.test_path || 'tests/' }}"
          EXTRA_ARGS="${{ inputs.pytest_args || '' }}"
          pytest -v $TEST_PATH $EXTRA_ARGS --junitxml=test-results.xml

      - name: Publish Test Summary to GitHub Actions
        if: always()
        run: |
          python scripts/generate_ci_summary.py test-results.xml

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            test-results/
            data/
          retention-days: 7